emailVerificationSubject=Vérifiez votre adresse e-mail
emailVerificationBody=Quelqu''un (probablement vous) a créé un compte agflow avec cette adresse. Si c''était bien vous, confirmez-le en cliquant sur ce lien :\n\n{0}\n\nCe lien expire dans {1}.\n\nSi vous n''avez pas créé de compte, ignorez ce message.
emailVerificationBodyHtml=<p>Quelqu''un (probablement vous) a créé un compte agflow avec cette adresse. Confirmez-le en cliquant ci-dessous.</p>

passwordResetSubject=Réinitialisation de votre mot de passe
passwordResetBody=Une demande de réinitialisation de mot de passe a été reçue pour votre compte. Si c''est bien vous, suivez ce lien :\n\n{0}\n\nCe lien expire dans {1}.\n\nSi vous n''êtes pas à l''origine de cette demande, ignorez ce message — votre mot de passe ne sera pas modifié.
passwordResetBodyHtml=<p>Une demande de réinitialisation de mot de passe a été reçue pour votre compte agflow.</p>

executeActionsSubject=Une action est requise sur votre compte
executeActionsBody=Une ou plusieurs actions sont requises sur votre compte agflow. Cliquez sur ce lien pour les exécuter :\n\n{0}\n\nCe lien expire dans {1}.\n\nSi vous n''attendez aucune action de la part d''agflow, ignorez ce message.
executeActionsBodyHtml=<p>Une ou plusieurs actions sont requises sur votre compte agflow.</p>

emailUpdateConfirmationSubject=Confirmez votre nouvelle adresse e-mail
emailUpdateConfirmationBody=Confirmez la mise à jour de l''adresse e-mail de votre compte vers {2} en cliquant sur :\n\n{0}\n\nCe lien expire dans {1}.
emailUpdateConfirmationBodyHtml=<p>Confirmez la mise à jour de votre adresse e-mail vers <strong>{2}</strong>.</p>

emailTestSubject=Test SMTP — agflow
emailTestBody=Si vous lisez ce message, votre configuration SMTP fonctionne correctement.
emailTestBodyHtml=<p>Si vous lisez ce message, votre configuration SMTP fonctionne correctement.</p>

